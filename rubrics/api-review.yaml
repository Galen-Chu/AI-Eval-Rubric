# API Review Rubric · API 設計評估
name: api-review
version: 1.0.0
description: >
  Evaluates API design quality: consistency, error handling, documentation,
  versioning, and security.
category: api

criteria:
  - id: consistency
    title: Consistency · 一致性
    weight: 1.3
    threshold: 0.8
    checklist:
      - Naming follows REST conventions (plural resources, kebab-case)
      - HTTP methods are used correctly (GET/POST/PUT/PATCH/DELETE)
      - Response format is consistent across endpoints
      - Pagination pattern is uniform

  - id: error-handling
    title: Error Responses · 錯誤回應
    weight: 1.2
    threshold: 0.7
    checklist:
      - Error responses follow a consistent schema
      - Status codes are semantically correct (400 vs 422 vs 500)
      - Error messages are descriptive and actionable
      - Validation errors include field-level details

  - id: documentation
    title: API Documentation · API 文件
    weight: 1.0
    threshold: 0.7
    checklist:
      - All endpoints are documented
      - Request/response examples provided
      - Authentication is explained
      - Rate limits documented (if applicable)

  - id: security
    title: Security · 安全性
    weight: 1.5
    threshold: 0.8
    checklist:
      - Authentication required on protected endpoints
      - Authorization checked (owner-only access)
      - Input validation/sanitization present
      - No sensitive data in responses
      - HTTPS enforced in production

  - id: versioning
    title: Versioning Strategy · 版本策略
    weight: 0.8
    threshold: 0.6
    checklist:
      - API version is communicated (URL/header)
      - Breaking changes documented
      - Backward compatibility maintained within version
      - Deprecation policy defined (if mature API)

scoring:
  method: weighted_average
  scale: [0, 1]
  pass_threshold: 0.80

report:
  format: markdown + json
  include:
    - per_criterion_scores
    - overall_score
    - security_flags
    - recommendations
